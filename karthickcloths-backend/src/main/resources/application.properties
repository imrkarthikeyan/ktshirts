spring.application.name=karthickcloths-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Render/Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated origins for browser access (frontend domains)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://trialbytshirt.com,https://www.trialbytshirt.com,https://trailbytshirt.vercel.app}

# Default local admin account for dashboard access
app.admin.email=${APP_ADMIN_EMAIL:admin@trialbytshirt.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Admin}

# Email OTP configuration
app.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
app.mail.port=${APP_MAIL_PORT:587}
app.mail.username=${APP_MAIL_USERNAME:trialbytshirt@gmail.com}
app.mail.password=${APP_MAIL_PASSWORD:pnxaueuesomngzhn}
app.mail.from=${APP_MAIL_FROM:trialbytshirt@gmail.com}
app.mail.smtp.auth=${APP_MAIL_SMTP_AUTH:true}
app.mail.smtp.starttls.enable=${APP_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.smtp.connectiontimeout=${APP_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
app.mail.smtp.timeout=${APP_MAIL_SMTP_TIMEOUT:5000}
app.mail.smtp.writetimeout=${APP_MAIL_SMTP_WRITETIMEOUT:5000}
app.otp.dev-fallback=${APP_OTP_DEV_FALLBACK:true}