spring.application.name=karthickcloths-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Render/Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated origins for browser access (frontend domains)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Default local admin account for dashboard access
app.admin.email=${APP_ADMIN_EMAIL:admin@trailbytshirt.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Admin}

# Email OTP configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:8karthikeyanr@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:fwkzcyuhfovporyv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:8karthikeyanr@gmail.com}
app.otp.dev-fallback=${APP_OTP_DEV_FALLBACK:false}